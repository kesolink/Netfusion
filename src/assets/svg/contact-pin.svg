<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contact NETFUSION via phone, email, or WhatsApp, with office location pin">
<defs>
  <linearGradient id="nf14-pin" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#123a73"></stop><stop offset="100%" stop-color="#082C5C"></stop>
  </linearGradient>
  <filter id="nf14-sh" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#082C5C" flood-opacity="0.15"></feDropShadow>
  </filter>
</defs>
<g font-family="Inter, 'Segoe UI', sans-serif">

<ellipse cx="230" cy="270" rx="90" ry="14" fill="#082C5C" opacity="0.08"></ellipse>

<!-- map pin -->
<g filter="url(#nf14-sh)">
  <path d="M230 90 C 190 90 165 122 165 158 C 165 205 230 260 230 260 C 230 260 295 205 295 158 C 295 122 270 90 230 90 Z" fill="url(#nf14-pin)"></path>
</g>
<circle cx="230" cy="158" r="28" fill="#FFFFFF"></circle>
<circle cx="230" cy="158" r="10" fill="#2E9B9C"></circle>
<circle cx="230" cy="158" r="40" fill="none" stroke="#2E9B9C" stroke-width="1.6" opacity="0.4">
  <animate attributeName="r" values="28;48;28" dur="2.8s" repeatCount="indefinite"></animate>
  <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"></animate>
</circle>

<!-- Phone badge -->
<g filter="url(#nf14-sh)"><rect x="20" y="40" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="50" cy="66" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<path d="M44 60 c0 8 6 14 14 14 l1.5 -4 l-5 -2 l-1.5 2 c-2.5 -1.5 -4.5 -3.5 -6 -6 l2 -1.5 l-2 -5 Z" fill="#2E9B9C"></path>
<text x="72" y="62" font-size="10.5" font-weight="700" fill="#111827">Call Us</text>
<text x="72" y="75" font-size="8.5" fill="#6B7280">Speak with our team</text>

<!-- Email badge -->
<g filter="url(#nf14-sh)"><rect x="290" y="40" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="320" cy="66" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<rect x="313" y="60" width="14" height="10" rx="1.5" fill="none" stroke="#2E9B9C" stroke-width="1.5"></rect>
<path d="M313 60 l7 6 l7 -6" fill="none" stroke="#2E9B9C" stroke-width="1.4"></path>
<text x="342" y="62" font-size="10.5" font-weight="700" fill="#111827">Email Us</text>
<text x="342" y="75" font-size="8.5" fill="#6B7280">info@netfusionideal.com</text>

<!-- WhatsApp badge -->
<g filter="url(#nf14-sh)"><rect x="155" y="248" width="150" height="52" rx="16" fill="#082C5C"></rect></g>
<circle cx="185" cy="274" r="14" fill="#2E9B9C" fill-opacity="0.25"></circle>
<path d="M185 267 a7 7 0 1 0 5.5 11.3 l4.5 1.2 l-1.2 -4.2 A7 7 0 0 0 185 267Z" fill="none" stroke="#FFFFFF" stroke-width="1.4"></path>
<text x="207" y="271" font-size="10.5" font-weight="700" fill="#FFFFFF">WhatsApp</text>
<text x="207" y="284" font-size="8.5" fill="#B9CBE0">Chat with sales</text>
</g>
</svg>
