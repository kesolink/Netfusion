<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Testimonial quote card with a five star rating">
<defs>
  <filter id="nf11-sh" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082C5C" flood-opacity="0.16"></feDropShadow>
  </filter>
  <clipPath id="nf11-avatar-clip">
    <circle cx="106" cy="200" r="14"></circle>
  </clipPath>
</defs>
<g font-family="Inter, 'Segoe UI', sans-serif">
<circle cx="90" cy="70" r="60" fill="#2E9B9C" fill-opacity="0.08"></circle>
<circle cx="400" cy="210" r="70" fill="#082C5C" fill-opacity="0.06"></circle>

<g filter="url(#nf11-sh)"><rect x="60" y="40" width="340" height="180" rx="20" fill="#FFFFFF"></rect></g>

<text x="88" y="90" font-size="46" font-weight="700" fill="#2E9B9C" fill-opacity="0.35" font-family="Georgia, serif">&#8220;</text>

<text x="90" y="114" font-size="11" fill="#374151">
  <tspan x="90" dy="0">NETFUSION took our core banking live in under</tspan>
  <tspan x="90" dy="18">ten weeks. The platform is fast, secure, and our</tspan>
  <tspan x="90" dy="18">team finally runs everything from one system.</tspan>
</text>

<!-- stars -->
<g fill="#F2B90D">
  <path id="nf11-star" d="M0 -8 L2.2 -2.6 L8 -2.4 L3.4 1.3 L5 7 L0 3.7 L-5 7 L-3.4 1.3 L-8 -2.4 L-2.2 -2.6 Z"></path>
  <use href="#nf11-star" x="105" y="178"></use>
  <use href="#nf11-star" x="125" y="178"></use>
  <use href="#nf11-star" x="145" y="178"></use>
  <use href="#nf11-star" x="165" y="178"></use>
  <use href="#nf11-star" x="185" y="178">
    <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="1.8s" repeatCount="indefinite" additive="sum"></animateTransform>
  </use>
</g>

<circle cx="106" cy="200" r="14" fill="#082C5C"></circle>
<image href="data:image/jpeg;base64," x="92" y="186" width="28" height="28" clip-path="url(#nf11-avatar-clip)" preserveAspectRatio="xMidYMid slice"></image>
<text x="128" y="197" font-size="10.5" font-weight="700" fill="#111827">Adaeze Obi</text>
<text x="128" y="209" font-size="8.5" fill="#6B7280">Managing Director, Microfinance Bank</text>
</g>
</svg>
