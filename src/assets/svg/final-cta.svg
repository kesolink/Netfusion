<svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schedule a demo today: calendar with a confirmed booking">
<defs>
  <linearGradient id="nf13-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#123a73"></stop><stop offset="100%" stop-color="#082C5C"></stop>
  </linearGradient>
  <filter id="nf13-sh" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#082C5C" flood-opacity="0.25"></feDropShadow>
  </filter>
</defs>
<g font-family="Inter, 'Segoe UI', sans-serif">
<g filter="url(#nf13-sh)"><rect x="20" y="20" width="480" height="180" rx="22" fill="url(#nf13-bg)"></rect></g>

<circle cx="440" cy="60" r="70" fill="#2E9B9C" fill-opacity="0.08"></circle>
<circle cx="70" cy="180" r="60" fill="#2E9B9C" fill-opacity="0.07"></circle>

<text x="52" y="80" font-size="18" font-weight="700" fill="#FFFFFF">Ready to modernise your</text>
<text x="52" y="104" font-size="18" font-weight="700" fill="#FFFFFF">banking operations?</text>

<g filter="url(#nf13-sh)">
  <rect x="52" y="126" width="170" height="42" rx="21" fill="#2E9B9C"></rect>
</g>
<text x="137" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Schedule a Demo</text>

<!-- calendar graphic -->
<g transform="translate(370 60)">
  <rect x="0" y="10" width="90" height="80" rx="10" fill="#FFFFFF"></rect>
  <rect x="0" y="10" width="90" height="22" rx="10" fill="#2E9B9C"></rect>
  <rect x="0" y="22" width="90" height="10" fill="#2E9B9C"></rect>
  <line x1="20" y1="4" x2="20" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></line>
  <line x1="70" y1="4" x2="70" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></line>
  <g fill="#C7D2E0">
    <circle cx="18" cy="48" r="3"></circle><circle cx="34" cy="48" r="3"></circle><circle cx="50" cy="48" r="3"></circle><circle cx="66" cy="48" r="3"></circle>
    <circle cx="18" cy="64" r="3"></circle><circle cx="50" cy="64" r="3"></circle><circle cx="66" cy="64" r="3"></circle>
  </g>
  <circle cx="34" cy="64" r="9" fill="#082C5C"></circle>
  <path d="M30 64 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="34" cy="64" r="14" fill="none" stroke="#2E9B9C" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="9;18;9" dur="2.4s" repeatCount="indefinite"></animate>
    <animate attributeName="opacity" values="0.55;0;0.55" dur="2.4s" repeatCount="indefinite"></animate>
  </circle>
</g>
</g>
</svg>
