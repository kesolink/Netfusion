<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banking network map connected to a live dashboard card">
<defs>
  <radialGradient id="nf1-glow" cx="35%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#2E9B9C" stop-opacity="0.18"></stop>
    <stop offset="100%" stop-color="#2E9B9C" stop-opacity="0"></stop>
  </radialGradient>
  <linearGradient id="nf1-bar" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#082C5C"></stop>
    <stop offset="100%" stop-color="#2E9B9C"></stop>
  </linearGradient>
  <linearGradient id="nf1-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2E9B9C"></stop>
    <stop offset="100%" stop-color="#082C5C"></stop>
  </linearGradient>
  <filter id="nf1-shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082C5C" flood-opacity="0.16"></feDropShadow>
  </filter>
  <filter id="nf1-shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#082C5C" flood-opacity="0.14"></feDropShadow>
  </filter>
</defs>

<ellipse cx="210" cy="200" rx="230" ry="190" fill="url(#nf1-glow)"></ellipse>

<!-- network graph -->
<g stroke="#B9C6D6" stroke-width="1.4">
  <line x1="90" y1="150" x2="170" y2="110"></line>
  <line x1="90" y1="150" x2="120" y2="230"></line>
  <line x1="170" y1="110" x2="250" y2="150"></line>
  <line x1="170" y1="110" x2="200" y2="60"></line>
  <line x1="120" y1="230" x2="210" y2="270"></line>
  <line x1="120" y1="230" x2="60" y2="290"></line>
  <line x1="250" y1="150" x2="210" y2="270"></line>
  <line x1="250" y1="150" x2="330" y2="130"></line>
  <line x1="210" y1="270" x2="290" y2="310"></line>
  <line x1="330" y1="130" x2="380" y2="175"></line>
</g>
<g fill="#082C5C">
  <circle cx="90" cy="150" r="4.5"></circle>
  <circle cx="170" cy="110" r="4.5"></circle>
  <circle cx="120" cy="230" r="4.5"></circle>
  <circle cx="200" cy="60" r="4.5"></circle>
  <circle cx="60" cy="290" r="4.5"></circle>
  <circle cx="210" cy="270" r="6" fill="#2E9B9C"></circle>
  <circle cx="290" cy="310" r="4.5"></circle>
  <circle cx="330" cy="130" r="5.5" fill="#2E9B9C"></circle>
</g>
<circle cx="250" cy="150" r="7" fill="#2E9B9C" opacity="0.9"></circle>
<circle cx="250" cy="150" r="12" fill="none" stroke="#2E9B9C" stroke-width="1.5" opacity="0.5">
  <animate attributeName="r" values="7;18;7" dur="3.2s" repeatCount="indefinite"></animate>
  <animate attributeName="opacity" values="0.55;0;0.55" dur="3.2s" repeatCount="indefinite"></animate>
</circle>

<!-- data flow line into dashboard -->
<path d="M 330 130 C 360 110, 380 95, 400 88" fill="none" stroke="url(#nf1-line)" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.8"></path>
<circle r="3" fill="#2E9B9C">
  <animateMotion dur="2.6s" repeatCount="indefinite" path="M 330 130 C 360 110, 380 95, 400 88"></animateMotion>
</circle>

<!-- floating dashboard card -->
<g filter="url(#nf1-shadow)">
  <rect x="330" y="60" width="230" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.86" stroke="#FFFFFF"></rect>
</g>
<text x="352" y="90" font-size="13" font-weight="700" fill="#111827" font-family="Inter, 'Segoe UI', sans-serif">Live Overview</text>
<circle cx="540" cy="85" r="4" fill="#2E9B9C">
  <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"></animate>
</circle>
<g>
  <rect x="352" y="140" width="14" height="34" rx="3" fill="url(#nf1-bar)"></rect>
  <rect x="374" y="122" width="14" height="52" rx="3" fill="url(#nf1-bar)"></rect>
  <rect x="396" y="150" width="14" height="24" rx="3" fill="url(#nf1-bar)"></rect>
  <rect x="418" y="108" width="14" height="66" rx="3" fill="url(#nf1-bar)"></rect>
  <rect x="440" y="130" width="14" height="44" rx="3" fill="url(#nf1-bar)"></rect>
</g>
<path d="M 352 104 L 372 96 L 392 100 L 412 84 L 432 90 L 462 76" fill="none" stroke="#2E9B9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<line x1="352" y1="188" x2="540" y2="188" stroke="#E5EAF1" stroke-width="1"></line>
<text x="352" y="203" font-size="10.5" fill="#6B7280" font-family="Inter, 'Segoe UI', sans-serif">Transactions processed today</text>

<!-- floating stat pills -->
<g filter="url(#nf1-shadow-sm)">
  <rect x="368" y="232" width="130" height="46" rx="23" fill="#082C5C"></rect>
</g>
<text x="384" y="251" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Inter, 'Segoe UI', sans-serif">99.9%</text>
<text x="384" y="266" font-size="10" fill="#B9CBE0" font-family="Inter, 'Segoe UI', sans-serif">Core banking uptime</text>

<g filter="url(#nf1-shadow-sm)">
  <rect x="70" y="330" width="150" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.92" stroke="#E5EAF1"></rect>
</g>
<circle cx="94" cy="353" r="10" fill="#2E9B9C" fill-opacity="0.15"></circle>
<path d="M 89 353 l 3.5 3.5 l 7 -8" fill="none" stroke="#2E9B9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="112" y="349" font-size="10.5" font-weight="700" fill="#111827" font-family="Inter, 'Segoe UI', sans-serif">100k+ TPS</text>
<text x="112" y="362" font-size="9.5" fill="#6B7280" font-family="Inter, 'Segoe UI', sans-serif">Transactions per second</text>
</svg>
