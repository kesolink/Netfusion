<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trust shield representing security, surrounded by audit trail, KYC monitoring, encryption, and regulatory compliance badges">
<defs>
  <linearGradient id="nf5-shield" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#123a73"></stop>
    <stop offset="100%" stop-color="#082C5C"></stop>
  </linearGradient>
  <filter id="nf5-shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082C5C" flood-opacity="0.2"></feDropShadow>
  </filter>
  <filter id="nf5-shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#082C5C" flood-opacity="0.12"></feDropShadow>
  </filter>
</defs>

<g font-family="Inter, 'Segoe UI', sans-serif">
<!-- concentric protection rings -->
<circle cx="280" cy="230" r="130" fill="none" stroke="#2E9B9C" stroke-opacity="0.14" stroke-width="1.5"></circle>
<circle cx="280" cy="230" r="100" fill="none" stroke="#2E9B9C" stroke-opacity="0.22" stroke-width="1.5"></circle>

<!-- shield -->
<g filter="url(#nf5-shadow)">
  <path d="M280 145 L336 168 V222 C336 268 312 300 280 316 C248 300 224 268 224 222 V168 Z" fill="url(#nf5-shield)"></path>
</g>
<path d="M255 231 L272 248 L308 205" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M255 231 L272 248 L308 205" fill="none" stroke="#2E9B9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

<!-- pulsing security ring -->
<circle cx="280" cy="230" r="70" fill="none" stroke="#2E9B9C" stroke-width="1.5" opacity="0.5">
  <animate attributeName="r" values="70;92;70" dur="3.4s" repeatCount="indefinite"></animate>
  <animate attributeName="opacity" values="0.5;0;0.5" dur="3.4s" repeatCount="indefinite"></animate>
</circle>

<!-- Audit Trail (top left) -->
<g filter="url(#nf5-shadow-sm)"><rect x="46" y="60" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="76" cy="86" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<rect x="70" y="79" width="12" height="14" rx="1.5" fill="none" stroke="#2E9B9C" stroke-width="1.5"></rect>
<line x1="72.5" y1="83.5" x2="79.5" y2="83.5" stroke="#2E9B9C" stroke-width="1.2"></line>
<line x1="72.5" y1="87" x2="79.5" y2="87" stroke="#2E9B9C" stroke-width="1.2"></line>
<text x="100" y="82" font-size="11" font-weight="700" fill="#111827">Audit Trail</text>
<text x="100" y="95" font-size="8.5" fill="#6B7280">Full transaction history</text>

<!-- KYC Monitoring (top right) -->
<g filter="url(#nf5-shadow-sm)"><rect x="364" y="60" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="394" cy="86" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<circle cx="392" cy="83" r="5" fill="none" stroke="#2E9B9C" stroke-width="1.5"></circle>
<line x1="396" y1="87" x2="400" y2="91" stroke="#2E9B9C" stroke-width="1.6" stroke-linecap="round"></line>
<text x="418" y="82" font-size="11" font-weight="700" fill="#111827">KYC &amp; AML</text>
<text x="418" y="95" font-size="8.5" fill="#6B7280">Continuous monitoring</text>

<!-- Encryption (bottom left) -->
<g filter="url(#nf5-shadow-sm)"><rect x="46" y="348" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="76" cy="374" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<rect x="70" y="374" width="12" height="9" rx="2" fill="none" stroke="#2E9B9C" stroke-width="1.5"></rect>
<path d="M72 374 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#2E9B9C" stroke-width="1.5"></path>
<text x="100" y="370" font-size="11" font-weight="700" fill="#111827">Encryption</text>
<text x="100" y="383" font-size="8.5" fill="#6B7280">Bank-grade data security</text>

<!-- Regulatory Compliance (bottom right) -->
<g filter="url(#nf5-shadow-sm)"><rect x="364" y="348" width="150" height="52" rx="16" fill="#FFFFFF"></rect></g>
<circle cx="394" cy="374" r="14" fill="#2E9B9C" fill-opacity="0.14"></circle>
<path d="M394 366 l5 2.3 v4.7 c0 3.6 -2.6 5.7 -5 6.6 c-2.4 -0.9 -5 -3 -5 -6.6 v-4.7Z" fill="none" stroke="#2E9B9C" stroke-width="1.4" stroke-linejoin="round"></path>
<text x="418" y="370" font-size="11" font-weight="700" fill="#111827">Compliance</text>
<text x="418" y="383" font-size="8.5" fill="#6B7280">Regulatory-ready reporting</text>
</g>
</svg>
