<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frequently asked questions represented as a question and answer chat exchange">
<defs>
  <filter id="nf12-sh" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#082C5C" flood-opacity="0.15"></feDropShadow>
  </filter>
</defs>
<g font-family="Inter, 'Segoe UI', sans-serif">

<!-- question bubble -->
<g filter="url(#nf12-sh)">
  <path d="M40 40 h230 a16 16 0 0 1 16 16 v70 a16 16 0 0 1 -16 16 h-170 l-30 26 v-26 h-30 a16 16 0 0 1 -16 -16 v-70 a16 16 0 0 1 16 -16 Z" fill="#F5F7FA"></path>
</g>
<circle cx="70" cy="90" r="14" fill="#082C5C"></circle>
<text x="70" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">?</text>
<line x1="100" y1="80" x2="250" y2="80" stroke="#C7D2E0" stroke-width="2" stroke-linecap="round"></line>
<line x1="100" y1="100" x2="220" y2="100" stroke="#C7D2E0" stroke-width="2" stroke-linecap="round"></line>

<!-- answer bubble -->
<g filter="url(#nf12-sh)">
  <path d="M420 190 h-230 a16 16 0 0 0 -16 16 v70 a16 16 0 0 0 16 16 h170 l30 26 v-26 h30 a16 16 0 0 0 16 -16 v-70 a16 16 0 0 0 -16 -16 Z" fill="#082C5C"></path>
</g>
<circle cx="390" cy="240" r="14" fill="#2E9B9C"></circle>
<path d="M384 240 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<line x1="360" y1="230" x2="210" y2="230" stroke="#3E5A85" stroke-width="2" stroke-linecap="round"></line>
<line x1="360" y1="250" x2="240" y2="250" stroke="#3E5A85" stroke-width="2" stroke-linecap="round"></line>

<!-- typing dots between them -->
<g fill="#2E9B9C">
  <circle cx="225" cy="160" r="3.2">
    <animate attributeName="cy" values="160;154;160" dur="1.2s" repeatCount="indefinite"></animate>
  </circle>
  <circle cx="238" cy="160" r="3.2">
    <animate attributeName="cy" values="160;154;160" dur="1.2s" begin="0.2s" repeatCount="indefinite"></animate>
  </circle>
  <circle cx="251" cy="160" r="3.2">
    <animate attributeName="cy" values="160;154;160" dur="1.2s" begin="0.4s" repeatCount="indefinite"></animate>
  </circle>
</g>
</g>
</svg>
