<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NETFUSION platform at the center, connected to NIP, NPS, Interswitch, Verve, SMS gateway, email gateway, open APIs, and third-party applications">
<defs>
  <radialGradient id="nf4-core" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#123a73"></stop>
    <stop offset="100%" stop-color="#082C5C"></stop>
  </radialGradient>
  <filter id="nf4-shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#082C5C" flood-opacity="0.18"></feDropShadow>
  </filter>
  <filter id="nf4-shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#082C5C" flood-opacity="0.12"></feDropShadow>
  </filter>
</defs>

<g font-family="Inter, 'Segoe UI', sans-serif">
<!-- spokes -->
<g stroke="#C7D2E0" stroke-width="1.4" stroke-dasharray="4 4">
  <line x1="280" y1="230" x2="280" y2="70"></line>
  <line x1="280" y1="230" x2="430" y2="120"></line>
  <line x1="280" y1="230" x2="475" y2="230"></line>
  <line x1="280" y1="230" x2="430" y2="340"></line>
  <line x1="280" y1="230" x2="280" y2="400"></line>
  <line x1="280" y1="230" x2="130" y2="340"></line>
  <line x1="280" y1="230" x2="85" y2="230"></line>
  <line x1="280" y1="230" x2="130" y2="120"></line>
</g>

<!-- animated pulse traveling one spoke -->
<circle r="3" fill="#2E9B9C">
  <animateMotion dur="2.2s" repeatCount="indefinite" path="M280 230 L475 230"></animateMotion>
</circle>

<!-- central hub: NETFUSION mark -->
<g filter="url(#nf4-shadow)">
  <circle cx="280" cy="230" r="46" fill="url(#nf4-core)"></circle>
</g>
<circle cx="280" cy="230" r="19" fill="none" stroke="#2E9B9C" stroke-width="3.4"></circle>
<circle cx="280" cy="230" r="5" fill="#2E9B9C"></circle>
<text x="280" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#082C5C">NETFUSION Platform</text>

<!-- 8 integration nodes -->
<!-- NIP (top) -->
<g filter="url(#nf4-shadow-sm)"><rect x="238" y="34" width="84" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="280" y="59" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">NIP</text>

<!-- Interswitch (upper right) -->
<g filter="url(#nf4-shadow-sm)"><rect x="392" y="88" width="96" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="440" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Interswitch</text>

<!-- Verve (right) -->
<g filter="url(#nf4-shadow-sm)"><rect x="433" y="210" width="84" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="475" y="235" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Verve</text>

<!-- Email Gateway (lower right) -->
<g filter="url(#nf4-shadow-sm)"><rect x="388" y="320" width="104" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="440" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Email Gateway</text>

<!-- Open APIs (bottom) -->
<g filter="url(#nf4-shadow-sm)"><rect x="234" y="380" width="92" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="280" y="405" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111827">Open APIs</text>

<!-- SMS Gateway (lower left) -->
<g filter="url(#nf4-shadow-sm)"><rect x="70" y="320" width="104" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="122" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">SMS Gateway</text>

<!-- NPS (left) -->
<g filter="url(#nf4-shadow-sm)"><rect x="20" y="210" width="84" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="62" y="235" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">NPS</text>

<!-- Third-party apps (upper left) -->
<g filter="url(#nf4-shadow-sm)"><rect x="66" y="88" width="112" height="40" rx="12" fill="#FFFFFF"></rect></g>
<text x="122" y="113" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111827">Third-Party Apps</text>
</g>
</svg>
